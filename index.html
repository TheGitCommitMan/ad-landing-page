<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>macOS — GTA 6 Mobile Installer</title>

  <style>
    :root {
      --mac-topbar: rgba(30, 41, 59, 0.75);
      --mac-window-bg: rgba(15, 23, 42, 0.85);
      --mac-border: rgba(255, 255, 255, 0.15);
      --mac-accent: #007aff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #ff758c, transparent 40%),
                  radial-gradient(circle at 80% 80%, #ff7eb3, transparent 40%),
                  radial-gradient(circle at 50% 50%, #6573ed, #141738);
      background-size: cover;
      color: #fff;
    }

    /* macOS Top Menu Bar */
    .mac-menubar {
      height: 30px;
      background: var(--mac-topbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid var(--mac-border);
      position: relative;
      z-index: 10000;
    }
    .menubar-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .apple-logo {
      font-size: 16px;
      font-weight: bold;
    }
    .menubar-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Desktop Area */
    .mac-desktop {
      height: calc(100vh - 30px - 80px);
      position: relative;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* macOS Window */
    .mac-window {
      width: 90%;
      max-width: 960px;
      height: 85%;
      background: var(--mac-window-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--mac-border);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popWindow 0.4s ease-out;
    }
    @keyframes popWindow {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Window Title Bar */
    .window-titlebar {
      height: 38px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--mac-border);
      display: flex;
      align-items: center;
      padding: 0 15px;
      position: relative;
    }
    .traffic-lights {
      display: flex;
      gap: 8px;
    }
    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .light-close { background: #ff5f56; border: 1px solid #e0443e; }
    .light-min { background: #ffbd2e; border: 1px solid #dea123; }
    .light-max { background: #27c93f; border: 1px solid #1aab29; }
    .window-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
    }

    /* Window Content Body */
    .window-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Download Box */
    .installer-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--mac-border);
      border-radius: 10px;
      padding: 25px;
      text-align: center;
    }
    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #007aff, #0051a8);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 35px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 122, 255, 0.4);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .download-btn:hover {
      transform: scale(1.03);
    }

    /* macOS Floating Dock */
    .mac-dock {
      height: 70px;
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10000;
    }
    .dock-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .dock-icon:hover {
      transform: translateY(-10px) scale(1.2);
    }

    /* macOS Notification Center Widget */
    .mac-notification {
      position: fixed;
      top: 40px;
      right: 20px;
      width: 320px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--mac-border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      z-index: 9999;
    }
    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }
  </style>

  <script>
    // Real-Time macOS Clock
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      document.getElementById('mac-clock').innerText = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    document.addEventListener("DOMContentLoaded", updateClock);

    function startDownload() {
      alert("Preparing high-speed installer package... Download will begin shortly.");
    }
  </script>
</head>

</body>
</html>
