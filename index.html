<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>Ad Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #060609;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Sticky Top Header Banner */
    .top-banner {
      position: sticky;
      top: 0;
      z-index: 10000;
      background: #000;
      border-bottom: 2px solid #222;
      display: flex;
      justify-content: center;
      padding: 6px;
      width: 100%;
    }

    /* Dense Ad Grid Matrix */
    .ad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
      padding-bottom: 100px;
    }

    .ad-card {
      background: #11131f;
      border: 1px solid #1e2238;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 270px;
    }
    .ad-card iframe {
      border: 0;
      width: 100%;
      height: 100%;
      min-height: 250px;
      background-color: transparent;
    }

    /* Floating Social Widget */
    .social-widget {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 9999;
      background: #11131f;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 320px;
    }

    /* Sticky Bottom Banner */
    .bottom-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #000;
      border-top: 2px solid #222;
      display: flex;
      justify-content: center;
      padding: 6px;
      z-index: 9990;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Banner -->
  <div class="top-banner">
    <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=728x90" style="border:0; padding:0; width:728px; height:90px; overflow:hidden; background-color: transparent;"></iframe>
  </div>

  <!-- Maximum Density Ad Matrix -->
  <div class="ad-grid">
    <div class="ad-card">
      <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=Adaptive"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="67018" src="//acceptable.a-ads.com/67018/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="200000" src="//acceptable.a-ads.com/200000/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="500000" src="//acceptable.a-ads.com/500000/?size=336x280"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=Adaptive"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="67018" src="//acceptable.a-ads.com/67018/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="200000" src="//acceptable.a-ads.com/200000/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="500000" src="//acceptable.a-ads.com/500000/?size=336x280"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=Adaptive"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="67018" src="//acceptable.a-ads.com/67018/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="200000" src="//acceptable.a-ads.com/200000/?size=300x250"></iframe>
    </div>

    <div class="ad-card">
      <iframe data-aa="500000" src="//acceptable.a-ads.com/500000/?size=336x280"></iframe>
    </div>
  </div>

  <!-- Floating Social Ad Widget -->
  <div class="social-widget" id="social-wid">
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #3b82f6; font-weight: bold; margin-bottom: 6px;">
      <span>SPONSORED AD</span>
      <button onclick="document.getElementById('social-wid').style.display='none'" style="background:none; border:none; color:#aaa; cursor:pointer;">✕</button>
    </div>
    <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=Adaptive" style="border:0; padding:0; width:100%; height:120px; overflow:hidden; background-color: transparent;"></iframe>
  </div>

  <!-- Bottom Sticky Banner -->
  <div class="bottom-banner">
    <iframe data-aa="2449055" src="//acceptable.a-ads.com/2449055/?size=728x90" style="border:0; padding:0; width:728px; height:90px; overflow:hidden; background-color: transparent;"></iframe>
  </div>

</body>
</html>
