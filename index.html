<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>Ad Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #05050a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .ad-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 15px;
      padding: 15px;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }
    .ad-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      position: relative;
    }
    .ad-box iframe {
      border: 0;
      width: 100%;
      height: 100%;
      min-height: 250px;
    }
    .sticky-top-ad {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: #000;
      border-bottom: 2px solid #222;
      display: flex;
      justify-content: center;
      padding: 5px;
    }
  </style>
</head>
<body>

  <!-- Sticky Header Banner -->
  <div class="sticky-top-ad">
    <iframe src="https://acceptable.a-ads.com/2449055/?size=728x90" style="width:728px; height:90px; border:0; overflow:hidden;"></iframe>
  </div>

  <div class="ad-wrapper">
    <!-- Public Live Ad Frame 1 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2449055/?size=Adaptive"></iframe>
    </div>

    <!-- Public Live Ad Frame 2 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/1/?size=300x250"></iframe>
    </div>

    <!-- Public Live Ad Frame 3 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2449055/?size=336x280"></iframe>
    </div>

    <!-- Public Live Ad Frame 4 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2/?size=300x250"></iframe>
    </div>

    <!-- Public Live Ad Frame 5 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2449055/?size=Adaptive"></iframe>
    </div>

    <!-- Public Live Ad Frame 6 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/1/?size=336x280"></iframe>
    </div>

    <!-- Public Live Ad Frame 7 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2449055/?size=728x90"></iframe>
    </div>

    <!-- Public Live Ad Frame 8 -->
    <div class="ad-box">
      <iframe src="https://acceptable.a-ads.com/2/?size=Adaptive"></iframe>
    </div>
  </div>

</body>
</html>
